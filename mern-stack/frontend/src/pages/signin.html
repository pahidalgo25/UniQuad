<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="signin.css">
</head>
<body>


<div class="topnav">
  
  <img src="logo.png">

  <a href="home.html">Home</a>
  <a href="#clubs">Clubs</a>
  <a href="#events">Events</a>
  <a class="active" id="signInLink" href="signin.html">Sign In</a>
  <img id="profileIcon" src="icon.png" style="display:none; width:40px;">"
</div>


<div class="wrapper">
    <div class="form-box signin">
        <h2>Sign In</h2>
        <form id="loginForm">
            <div class="input-box">
                <span class="icon"></span>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <input type="password" id="password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">
                Remember me</label>
                <a href=""#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div class="signin-createaccount">
                <p>Don't have an account?<a href="#" class ="createaccount-link">Create Account</a></p>
            </div>
        </form>
        <p id="error" style="color:red;"></p>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("error");

        //Example validation
        if (email === "johndoe@gmail.com" && password === "25Bulldogs") {
            sessionStorage.setItem("loggedIn", "true");
            errorMsg.textContent = "";
            window.location.href = "home.html";
        } else {
            errorMsg.textContent = "Invalid email or password.";
        }
        });   
    </script>

    <div class="form-box createaccount">
        <h2>Create Account</h2>
        <form id="signupForm" onsubmit="validateForm(event)">
            <div class="input-box">
                <span class="icon"></span>
                <input type="text" id="username" required>
                <label>Username</label>
            </div>
            <div class="input-box">
                <span class="icon"></span>
                <input type="email" id="signupEmail" required>
                <label>Email</label>
            </div>
            <div class="input-box">
                <span class="icon"></span>
                <input type="password" id="signupPassword" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" required>
                <label>Password</label>
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox">
                I agree to the terms & conditions</label>
            </div>
            <button type="submit" class="btn">Create Account</button>
            <div class="signin-createaccount">
                <p>Already have an account?<a href="#" class ="signin-link">Sign In</a></p>
            </div>
        </form>
    </div>
</div>

    <script src="signin.js"></script>
    <script>
            function validateForm(event) {
                event.preventDefault(); // prevent default form submission

                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value.trim();

                if (!username || !email || !password) {
                    alert('Please fill all required fields.');
                    return false;
                }

                // Redirect to home page after successful validation
                sessionStorage.setItem("loggedIn", "true");
                window.location.href = 'home.html';
            }
        </script>
</body>
</html>
